<!doctype html>
<html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapitalstrøm – lag admin-hash</title>
<style>body{font-family:system-ui;max-width:680px;margin:60px auto;padding:0 20px}input,button{font:inherit;padding:10px;margin:6px 0;width:100%}code{display:block;word-break:break-all;background:#f3f3f3;padding:14px;margin-top:16px}</style>
<h1>Lag ADMIN_PASSWORD_HASH lokalt</h1><p>Denne siden sender ingenting noe sted. Den bruker nettleserens Web Crypto lokalt på maskinen din.</p>
<input id="p" type="password" placeholder="Velg admin-passord"><button id="b">Lag SHA-256-hash</button><code id="out">Hash vises her</code>
<script>const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');b.onclick=async()=>{out.textContent=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p.value)))};</script>
</html>
