name: Deploy production prebuilt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-prebuilt-production.yml'

concurrency:
  group: kapitalstrom-vercel-prebuilt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: prj_dt9X67WnEvEROT1WntALIWd5I68T
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Vercel token is configured
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub repository secret VERCEL_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Reset local Vercel link
        run: rm -rf .vercel

      - name: Verify token can read project
        run: |
          STATUS="$(curl --silent --output /tmp/project.json --write-out '%{http_code}'             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vercel project access check failed with HTTP $STATUS"
            cat /tmp/project.json | jq '{error}'
            exit 1
          fi
          jq '{id,name}' /tmp/project.json

      - name: Pull production environment
        run: vercel pull --yes --environment=production --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Build production locally in GitHub
        run: vercel build --prod --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: |
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN")"
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Verify production deployment
        run: |
          URL="${{ steps.deploy.outputs.deployment_url }}"
          test -n "$URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$URL/api/health" || true
          echo "Production deployment uploaded: $URL"
