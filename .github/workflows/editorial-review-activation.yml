name: Activate editorial review mode
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-review-activation.yml'
      - 'scripts/activate-editorial-review.mjs'
permissions:
  contents: read
concurrency:
  group: kapitalstrom-editorial-autopilot
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deployed commit, enable drafts and complete one scheduled round
        env:
          EDITORIAL_PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.EDITORIAL_PRODUCTION_DATABASE_URL_UNPOOLED }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/activate-editorial-review.mjs
