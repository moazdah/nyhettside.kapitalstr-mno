name: Editorial Neon validation
on:
  workflow_dispatch:
  push:
    branches: [codex/redaksjon-sammenheng]
    paths:
      - '.github/workflows/editorial-neon-validation.yml'
      - 'scripts/validate-editorial-neon.mjs'
      - 'scripts/editorial-runtime.mjs'
permissions:
  contents: read
concurrency:
  group: kapitalstrom-editorial-neon-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Validate isolated Neon migration and real DeepSeek requests
        env:
          EDITORIAL_TEST_DATABASE_URL_UNPOOLED: ${{ secrets.EDITORIAL_TEST_DATABASE_URL_UNPOOLED }}
          EDITORIAL_PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.EDITORIAL_PRODUCTION_DATABASE_URL_UNPOOLED }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node --experimental-vm-modules scripts/validate-editorial-neon.mjs
      - name: Configure the existing preview branch for review mode
        env:
          EDITORIAL_TEST_DATABASE_URL_UNPOOLED: ${{ secrets.EDITORIAL_TEST_DATABASE_URL_UNPOOLED }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/configure-editorial-preview.mjs
