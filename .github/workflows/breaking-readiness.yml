name: Breaking desk readiness
on:
  push:
    branches: [codex/breaking-news-desk]
    paths: ['.github/workflows/breaking-readiness.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check presence of existing production admin password configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://api.vercel.com/v9/projects/prj_dt9X67WnEvEROT1WntALIWd5I68T/env?teamId=team_RbPY2JdK0IeLUf78YlfJUaxg',{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}});
          const result=await r.json();
          console.log(JSON.stringify({status:r.status,productionAdminPasswordConfigured:Array.isArray(result.envs)?result.envs.some(e=>e.key==='ADMIN_PASSWORD_HASH'&&e.target?.includes('production')):null}));
          JS
