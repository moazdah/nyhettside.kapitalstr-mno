name: Breaking desk readiness
on:
  push:
    branches: [codex/breaking-news-desk]
    paths: ['.github/workflows/breaking-readiness.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect public source excerpt retained by the isolated test
        env:
          DATABASE_URL: ${{ secrets.EDITORIAL_TEST_DATABASE_URL_UNPOOLED }}
        run: |
          node --input-type=module <<'JS'
          import {neon} from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const [rows]=await sql.transaction([sql`SELECT left(evidence->>'text',2500) AS source_excerpt FROM breaking_events ORDER BY id DESC LIMIT 1`],{readOnly:true});
          console.log(JSON.stringify({publicSource:rows}));
          JS
