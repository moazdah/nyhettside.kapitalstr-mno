name: Prepare editorial production database
on:
  workflow_dispatch:
  push:
    branches: [codex/redaksjon-sammenheng]
    paths:
      - '.github/workflows/editorial-production-prepare.yml'
      - 'scripts/prepare-editorial-production.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: kapitalstrom-editorial-production-migration
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require successful real Neon validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response=await fetch('https://api.github.com/repos/moazdah/nyhettside.kapitalstr-mno/actions/runs/35582122124',{
            headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          assert.ok(response.ok);
          const run=await response.json();
          assert.equal(run.head_sha,'de3e5bb2bb5b76e050e817425bc05062a43c43b5');
          assert.equal(run.conclusion,'success');
          console.log('Verified successful isolated database and real DeepSeek validation.');
          JS
      - name: Apply the verified additive migration with automation paused
        env:
          EDITORIAL_TEST_DATABASE_URL_UNPOOLED: ${{ secrets.EDITORIAL_TEST_DATABASE_URL_UNPOOLED }}
          EDITORIAL_PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.EDITORIAL_PRODUCTION_DATABASE_URL_UNPOOLED }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/prepare-editorial-production.mjs
