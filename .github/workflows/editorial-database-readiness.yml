name: Editorial database readiness (read only)

on:
  workflow_dispatch:
  push:
    branches: [codex/redaksjon-sammenheng]
    paths:
      - '.github/workflows/editorial-database-readiness.yml'
      - 'scripts/database-readiness.mjs'

permissions:
  contents: read

concurrency:
  group: kapitalstrom-database-readiness
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect existing database connections without changing data
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_dt9X67WnEvEROT1WntALIWd5I68T
          VERCEL_TEAM_ID: team_RbPY2JdK0IeLUf78YlfJUaxg
          EDITORIAL_BRANCH: codex/redaksjon-sammenheng
        run: node scripts/database-readiness.mjs
