name: Kapitalstrøm live-puls

on:
  schedule:
    # Lightweight check every five minutes, offset from the top of the hour. Route enforces 06-23 Europe/Oslo.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 4-22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-pulse.yml'

concurrency:
  group: kapitalstrom-live-pulse
  cancel-in-progress: false

jobs:
  live-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refresh live news rail and market ticker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://nyhettside-kapitalstr-mno-ashy.vercel.app
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"

          call_step() {
            curl --fail --silent --show-error \
              --retry 2 --retry-all-errors --retry-delay 4 \
              --max-time 65 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$1"
          }

          echo "Starter Kapitalstrøm live-puls …"
          response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=start")"
          echo "$response" | jq .

          if [ "$(echo "$response" | jq -r '.skipped // false')" = "true" ]; then
            echo "Live-puls hoppet over: $(echo "$response" | jq -r '.reason // "skipped"')"
            exit 0
          fi

          pulse_id="$(echo "$response" | jq -r '.pulseId')"
          test "$pulse_id" != "null"
          test -n "$pulse_id"

          response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=score&pulseId=$pulse_id")"
          echo "$response" | jq .

          response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=publish&pulseId=$pulse_id")"
          echo "$response" | jq .

          response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=markets&pulseId=$pulse_id")"
          echo "$response" | jq .

          test "$(echo "$response" | jq -r '.stage')" = "done"
          echo "Live-puls ferdig."
