name: Kapitalstrøm live-puls

on:
  schedule:
    # GitHub's high-frequency scheduler can be delayed or drop individual wake-ups.
    # Wake twice per hour and keep the runner alive for six five-minute pulses.
    # The route itself enforces 06-23 Europe/Oslo.
    - cron: '2,32 4-22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-pulse.yml'

concurrency:
  group: kapitalstrom-live-pulse
  cancel-in-progress: false

jobs:
  live-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Refresh live news rail and market ticker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://nyhettside-kapitalstr-mno-ashy.vercel.app
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"

          loops=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            loops=6
          fi

          call_step() {
            curl --fail --silent --show-error \
              --retry 2 --retry-all-errors --retry-delay 4 \
              --max-time 290 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$1"
          }

          for pulse in $(seq 1 "$loops"); do
            cycle_started="$(date +%s)"
            echo "Live-puls $pulse/$loops starter …"

            response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=start")"
            echo "$response" | jq .

            skipped="$(echo "$response" | jq -r '.skipped // false')"
            if [ "$skipped" = "true" ]; then
              reason="$(echo "$response" | jq -r '.reason // "skipped"')"
              echo "Live-puls hoppet over: $reason"

              if [ "$reason" = "automation_disabled" ] || [ "$reason" = "outside_active_hours" ]; then
                exit 0
              fi
            else
              pulse_id="$(echo "$response" | jq -r '.pulseId')"
              test "$pulse_id" != "null"
              test -n "$pulse_id"

              response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=score&pulseId=$pulse_id")"
              echo "$response" | jq .

              response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=publish&pulseId=$pulse_id")"
              echo "$response" | jq .

              response="$(call_step "$BASE_URL/api/cron/live-pulse?stage=markets&pulseId=$pulse_id")"
              echo "$response" | jq .

              test "$(echo "$response" | jq -r '.stage')" = "done"
              echo "Live-puls $pulse/$loops ferdig."
            fi

            if [ "$pulse" -lt "$loops" ]; then
              elapsed="$(( $(date +%s) - cycle_started ))"
              wait="$(( 300 - elapsed ))"
              if [ "$wait" -gt 0 ]; then
                echo "Venter $wait sekunder til neste femminutterskontroll …"
                sleep "$wait"
              fi
            fi
          done
